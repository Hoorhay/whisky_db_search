<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Whisky DB Search</title>
  <link rel="icon" href="assets/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-192x192.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="manifest" href="/whisky_db_search/manifest.json">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <!-- Full Fuse.js bundle -->
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js"></script>
  
  <!-- Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>

<body class="bg-zinc-950 text-zinc-100 min-h-screen font-sans selection:bg-amber-500/30 selection:text-amber-200 antialiased pb-20">

  <!-- Subtle gradient background blur behind top content -->
  <div class="fixed top-0 left-1/2 -translate-x-1/2 w-full max-w-7xl h-96 bg-amber-600/5 blur-[120px] pointer-events-none -z-10"></div>

  <div class="max-w-6xl mx-auto px-4 sm:px-6 pt-6 sm:pt-10">
    
    <!-- Header -->
    <header class="mb-8 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-6 border-b border-zinc-800/80 pb-6">
      <div class="flex items-center gap-3.5">
        <div class="relative">
          <img src="assets/web-app-manifest-192x192.png" alt="Whisky DB" class="w-12 h-12 rounded-xl shadow-lg ring-1 ring-amber-500/20 object-cover">
          <div class="absolute -bottom-1 -right-1 w-3.5 h-3.5 bg-emerald-500 rounded-full ring-2 ring-zinc-950" title="Online"></div>
        </div>
        <div>
          <h1 class="text-2xl sm:text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-amber-200 via-amber-400 to-amber-500 tracking-tight">
            Whisky DB
          </h1>
          <p class="text-xs sm:text-sm text-zinc-400 font-normal">Search by Name, Year, ABV, Score, or WB Code</p>
        </div>
      </div>

      <div class="flex items-center gap-2.5 self-start sm:self-auto">
        <button id="syncBtn" class="bg-amber-500/10 hover:bg-amber-500/20 text-amber-400 border border-amber-500/20 px-3.5 py-2 rounded-xl text-xs font-semibold flex items-center gap-2 transition-all active:scale-95 cursor-pointer shadow-sm">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
          Sync DB
        </button>
        <button id="configBtn" class="bg-zinc-900 hover:bg-zinc-800 text-zinc-300 border border-zinc-800 px-3.5 py-2 rounded-xl text-xs font-semibold flex items-center gap-2 transition-all active:scale-95 cursor-pointer shadow-sm">
          <svg class="w-4 h-4 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
          Config
        </button>
      </div>
    </header>

    <!-- Floating / Sticky Modern Search Input Bar -->
    <div class="sticky top-4 z-30 mb-6">
      <div class="relative flex items-center shadow-2xl rounded-2xl">
        <input
          type="text"
          id="searchInput"
          placeholder="Search (e.g. Caol Lady 2025 55.4)"
          class="w-full bg-zinc-900/80 backdrop-blur-xl border border-zinc-700/60 text-white rounded-2xl pl-12 pr-11 py-3.5 text-base sm:text-lg focus:outline-none focus:border-amber-500/60 focus:ring-4 focus:ring-amber-500/10 transition-all placeholder:text-zinc-500"
        />
        <svg class="w-5 h-5 absolute left-4 text-zinc-400 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
        </svg>
        <button
          id="clearBtn"
          class="hidden absolute right-3.5 text-zinc-400 hover:text-white transition-colors p-1 cursor-pointer bg-zinc-800 rounded-lg"
          aria-label="Clear search"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>
      </div>
    </div>

    <!-- Status Bar -->
    <div class="flex items-center justify-between mb-4 px-1.5">
      <div id="statusText" class="text-xs sm:text-sm text-zinc-400 font-medium">Checking credentials...</div>
    </div>

    <!-- Results: Responsive Container (Table on Desktop, Cards on Mobile) -->
    <div class="bg-zinc-900/50 rounded-2xl shadow-xl border border-zinc-800 overflow-hidden backdrop-blur-md">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-zinc-300">
          <thead class="hidden md:table-header-group bg-zinc-900/80 text-zinc-400 uppercase text-[11px] font-semibold tracking-wider border-b border-zinc-800">
            <tr>
              <th class="px-6 py-4">Name</th>
              <th class="px-6 py-4">ABV</th>
              <th class="px-6 py-4">Year</th>
              <th class="px-6 py-4">Score</th>
              <th class="px-6 py-4">WB Code</th>
            </tr>
          </thead>
          <tbody id="resultsBody" class="divide-y divide-zinc-800/60">
            <tr>
              <td colspan="5" class="px-6 py-12 text-center text-zinc-500 font-medium">Awaiting authentication...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Detail Modal -->
  <div id="detailModal" class="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 z-50 hidden transition-all">
    <div class="bg-zinc-900 border border-zinc-800 rounded-2xl max-w-lg w-full p-6 shadow-2xl space-y-5 relative transform transition-all scale-100">
      <button id="detailCloseBtn" class="absolute top-4 right-4 text-zinc-400 hover:text-white bg-zinc-800/50 hover:bg-zinc-800 p-2 rounded-xl transition cursor-pointer">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
      </button>

      <div id="detailContent">
        <!-- Dynamic Content -->
      </div>
    </div>
  </div>

  <!-- Config Modal -->
  <div id="configModal" class="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 z-50 hidden transition-all">
    <div class="bg-zinc-900 border border-zinc-800 rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-5">
      <div class="flex justify-between items-center border-b border-zinc-800 pb-4">
        <div class="flex items-center gap-2">
          <span class="text-xl">🔑</span>
          <h2 class="text-lg font-bold text-white">Database Config</h2>
        </div>
        <button id="modalCloseBtn" class="text-zinc-400 hover:text-white bg-zinc-800/50 hover:bg-zinc-800 p-1.5 rounded-lg transition cursor-pointer">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>

      <div class="space-y-4">
        <div>
          <label for="modalDbUrl" class="block text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-1.5">Firebase Base URL</label>
          <input
            type="url"
            id="modalDbUrl"
            placeholder="https://YOUR-PROJECT-ID-default-rtdb.firebaseio.com"
            class="w-full bg-zinc-950 border border-zinc-800 text-white rounded-xl p-3 text-sm focus:outline-none focus:border-amber-500 transition placeholder:text-zinc-600"
          />
        </div>

        <div>
          <label for="modalAccessCode" class="block text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-1.5">Access Code / Tracker</label>
          <input
            type="password"
            id="modalAccessCode"
            placeholder="Enter access code"
            class="w-full bg-zinc-950 border border-zinc-800 text-white rounded-xl p-3 text-sm focus:outline-none focus:border-amber-500 transition placeholder:text-zinc-600"
          />
        </div>
      </div>

      <div class="flex justify-end gap-2.5 pt-3 border-t border-zinc-800">
        <button id="modalCancelBtn" class="px-4 py-2 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 text-xs font-semibold rounded-xl transition cursor-pointer">
          Cancel
        </button>
        <button id="modalSaveBtn" class="px-4 py-2 bg-amber-500 hover:bg-amber-400 text-zinc-950 text-xs font-bold rounded-xl transition cursor-pointer shadow-lg shadow-amber-500/10">
          Save & Sync
        </button>
      </div>
    </div>
  </div>

  <!-- Scroll to Top Button -->
  <button
    id="scrollToTopBtn"
    class="fixed bottom-6 right-6 bg-amber-500 hover:bg-amber-400 text-zinc-950 p-3.5 rounded-2xl shadow-2xl transition-all duration-300 opacity-0 pointer-events-none z-40 cursor-pointer active:scale-90"
    aria-label="Scroll to top"
  >
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 10l7-7m0 0l7 7m-7-7v18"></path>
    </svg>
  </button>

  <script>
    const STORAGE_KEY_DB_URL = 'whisky_tracker_db_url';
    const STORAGE_KEY_ACCESS_CODE = 'whisky_tracker_access_code';
    const STORAGE_KEY_CACHE = 'whisky_tracker_cache_data';
    const STORAGE_KEY_LAST_SYNC = 'whisky_tracker_last_sync';

    let rawData = [];
    let currentFilteredData = [];
    let fuse = null;

    const searchInput = document.getElementById('searchInput');
    const clearBtn = document.getElementById('clearBtn');
    const resultsBody = document.getElementById('resultsBody');
    const statusText = document.getElementById('statusText');
    const configBtn = document.getElementById('configBtn');
    const syncBtn = document.getElementById('syncBtn');

    // Config Modal elements
    const configModal = document.getElementById('configModal');
    const modalDbUrl = document.getElementById('modalDbUrl');
    const modalAccessCode = document.getElementById('modalAccessCode');
    const modalSaveBtn = document.getElementById('modalSaveBtn');
    const modalCancelBtn = document.getElementById('modalCancelBtn');
    const modalCloseBtn = document.getElementById('modalCloseBtn');

    // Detail Modal elements
    const detailModal = document.getElementById('detailModal');
    const detailContent = document.getElementById('detailContent');
    const detailCloseBtn = document.getElementById('detailCloseBtn');

    // Scroll to Top Button element
    const scrollToTopBtn = document.getElementById('scrollToTopBtn');

    function openModal() {
      modalDbUrl.value = localStorage.getItem(STORAGE_KEY_DB_URL) || '';
      modalAccessCode.value = localStorage.getItem(STORAGE_KEY_ACCESS_CODE) || '';
      configModal.classList.remove('hidden');
    }

    function closeModal() {
      configModal.classList.add('hidden');
    }

    // Helper function to extract individual WB codes from string/number
    function parseWbCodes(wbVal) {
      if (wbVal === undefined || wbVal === null || wbVal === '') return [];
      return String(wbVal)
        .replace(/\r\n|\r/g, '\n')
        .split('\n')
        .map(code => code.trim())
        .filter(code => code.length > 0);
    }

    // Helper to generate multiple links for Modal Card View
    function formatWbLinks(wbVal) {
      const codes = parseWbCodes(wbVal);
      if (codes.length === 0) return '-';

      return codes.map(code => {
        const cleanCode = code.replace(/\D/g, '') || code; 
        return `<a href="https://www.whiskybase.com/whiskies/whisky/${escapeHtml(cleanCode)}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1.5 bg-amber-500/10 text-amber-400 hover:bg-amber-500/20 px-2.5 py-1 rounded-md text-xs font-mono font-medium transition border border-amber-500/20">
          WB${escapeHtml(code)}
          <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
        </a>`;
      }).join(' ');
    }

    // Helper to generate line-separated text for List/Table View
    function formatWbList(wbVal) {
      const codes = parseWbCodes(wbVal);
      if (codes.length === 0) return '-';
      return escapeHtml(codes.join('\n'));
    }

    function openDetailModal(item) {
      const formattedYear = item.Year
        ? escapeHtml(String(item.Year).replace(/\r\n|\r/g, '\n'))
        : '-';

      const wbLink = formatWbLinks(item.WBcode);

      // Standard keys to exclude from additional metadata
      const excludedKeys = ['Name', 'ABV', 'Year', 'Score', 'WBcode', 'searchableABV', 'YearStr', 'ScoreStr', 'WBcodeStr', 'id'];

      // Preferred order for tasting metadata
      const preferredOrder = ['Nose', 'Nosa', 'Taste', 'Finish'];

      const metadataEntries = Object.entries(item)
        .filter(([k]) => !excludedKeys.includes(k))
        .sort(([a], [b]) => {
          const indexA = preferredOrder.indexOf(a);
          const indexB = preferredOrder.indexOf(b);

          if (indexA !== -1 && indexB !== -1) return indexA - indexB;
          if (indexA !== -1) return -1;
          if (indexB !== -1) return 1;
          return a.localeCompare(b);
        });

      detailContent.innerHTML = `
        <h2 class="text-xl font-bold text-amber-400 pr-8 leading-snug">${escapeHtml(item.Name || 'Unknown Whisky')}</h2>

        <div class="grid grid-cols-2 gap-3 bg-zinc-950/80 p-4 rounded-xl border border-zinc-800/80">
          <div>
            <span class="block text-[10px] uppercase tracking-wider text-zinc-500 font-bold mb-0.5">ABV</span>
            <span class="text-xl font-bold text-zinc-100">${formatAbv(item.ABV)}</span>
          </div>
          <div>
            <span class="block text-[10px] uppercase tracking-wider text-zinc-500 font-bold mb-1.5">WB Link(s)</span>
            <div class="flex flex-wrap gap-1.5">${wbLink}</div>
          </div>
          <div>
            <span class="block text-[10px] uppercase tracking-wider text-zinc-500 font-bold mb-0.5">Year</span>
            <span class="text-sm text-zinc-300 font-medium whitespace-pre-line">${formattedYear}</span>
          </div>
          <div>
            <span class="block text-[10px] uppercase tracking-wider text-zinc-500 font-bold mb-0.5">Score</span>
            <span class="text-xl font-bold text-emerald-400">${escapeHtml(String(item.Score || '-'))}</span>
          </div>
        </div>

        ${metadataEntries.length > 0 ? `
          <div class="border-t border-zinc-800/80 pt-3 space-y-2.5">
            <h3 class="text-s uppercase tracking-wider text-zinc-400 font-bold">Details & Notes</h3>
            <div class="space-y-2 max-h-48 overflow-y-auto pr-1 custom-scrollbar">
              ${metadataEntries
                .map(([k, v]) => `
                  <div class="text-xs bg-zinc-950/40 p-2.5 rounded-lg border border-zinc-800/50">
                    <span class="text-amber-500/80 font-medium block mb-0.5">${escapeHtml(k)}</span>
                    <span class="text-zinc-300">${escapeHtml(String(v))}</span>
                  </div>`)
                .join('')}
            </div>
          </div>
        ` : ''}
      `;

      detailModal.classList.remove('hidden');
    }

    function closeDetailModal() {
      detailModal.classList.add('hidden');
    }

    function saveCredentialsAndFetch() {
      const dbUrl = modalDbUrl.value.trim().replace(/\/+$/, '');
      const accessCode = modalAccessCode.value.trim();

      if (dbUrl) localStorage.setItem(STORAGE_KEY_DB_URL, dbUrl);
      if (accessCode) localStorage.setItem(STORAGE_KEY_ACCESS_CODE, accessCode);

      closeModal();
      fetchFreshData();
    }

    function getStoredCredentials() {
      const dbUrl = localStorage.getItem(STORAGE_KEY_DB_URL);
      const accessCode = localStorage.getItem(STORAGE_KEY_ACCESS_CODE);
      return { dbUrl, accessCode };
    }

    function getEndpointUrl() {
      const { dbUrl, accessCode } = getStoredCredentials();
      if (!dbUrl || !accessCode) return null;
      return `${dbUrl}/trackers/${accessCode}.json`;
    }

    async function fetchFreshData() {
      const endpoint = getEndpointUrl();

      if (!endpoint) {
        statusText.innerText = "Missing configuration. Click 'Config' to set up credentials.";
        resultsBody.innerHTML = `<tr><td colspan="5" class="px-6 py-12 text-center text-amber-400 font-medium">Configuration required to fetch data.</td></tr>`;
        openModal();
        return;
      }

      statusText.innerText = "Fetching fresh whiskies from Firebase...";

      try {
        const response = await fetch(endpoint);

        if (response.status === 401 || response.status === 403) {
          throw new Error("Unauthorized access. Please check your Access Code.");
        }
        if (!response.ok) {
          throw new Error(`HTTP Error ${response.status}`);
        }

        const data = await response.json();
        rawData = Array.isArray(data) ? data.filter(item => item && item.Name) : [];

        const now = new Date();
        const day = String(now.getDate()).padStart(2, '0');
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const year = String(now.getFullYear()).slice(-2);
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');

        const nowFormatted = `${hours}:${minutes}, ${day}.${month}.${year}`;

        localStorage.setItem(STORAGE_KEY_CACHE, JSON.stringify(rawData));
        localStorage.setItem(STORAGE_KEY_LAST_SYNC, nowFormatted);

        initSearchAndUI(`Synced now (${nowFormatted}).`);
      } catch (err) {
        console.error(err);
        statusText.innerText = `Error: ${err.message}`;
        resultsBody.innerHTML = `<tr><td colspan="5" class="px-6 py-12 text-center text-red-400 font-medium">${err.message}</td></tr>`;
      }
    }

    function loadData() {
      const cached = localStorage.getItem(STORAGE_KEY_CACHE);
      const lastSync = localStorage.getItem(STORAGE_KEY_LAST_SYNC);

      if (cached) {
        try {
          rawData = JSON.parse(cached);
          const syncInfo = lastSync ? `Last sync: ${lastSync}` : '';
          initSearchAndUI(`${syncInfo}`);
          return;
        } catch (e) {
          console.error("Failed to parse local cache. Re-fetching...", e);
        }
      }

      fetchFreshData();
    }

    function initSearchAndUI(sourceMessage) {
      const searchableData = rawData.map(item => {
        const cleanAbv = item.ABV !== undefined && item.ABV !== null
          ? String(item.ABV).replace(/%/g, '').replace(',', '.').trim()
          : '';

        return {
          ...item,
          searchableABV: cleanAbv,
          YearStr: item.Year ? String(item.Year) : '',
          ScoreStr: item.Score ? String(item.Score) : '',
          WBcodeStr: item.WBcode ? String(item.WBcode) : ''
        };
      });

      fuse = new Fuse(searchableData, {
        keys: [
          { name: 'Name', weight: 0.5 },
          { name: 'YearStr', weight: 0.2 },
          { name: 'WBcodeStr', weight: 0.1 },
          { name: 'searchableABV', weight: 0.15 },
          { name: 'ScoreStr', weight: 0.05 }
        ],
        threshold: 0.3,
        ignoreLocation: true,
        useExtendedSearch: true
      });

      statusText.innerText = `${sourceMessage} Total: ${rawData.length} whiskies.`;

      if (searchInput.value.trim()) {
        searchInput.dispatchEvent(new Event('input'));
      } else {
        renderTable(rawData);
      }
    }

    function getAverageScore(items) {
      const validScores = items
        .map(item => parseFloat(String(item.AvgScore).replace(',', '.')))
        .filter(score => !isNaN(score));

      if (validScores.length === 0) return null;

      const total = validScores.reduce((sum, score) => sum + score, 0);
      return Math.round(total / validScores.length);
    }

    function formatAbv(val) {
      if (val === undefined || val === null || val === '') return '-';
      const normalizedStr = String(val).replace(/%/g, '').replace(',', '.');
      const num = parseFloat(normalizedStr);
      if (isNaN(num)) return escapeHtml(String(val));

      const percentage = num <= 1 ? num * 100 : num;
      return `${percentage.toFixed(1)}%`;
    }

    function renderTable(items) {
      currentFilteredData = items;
      if (items.length === 0) {
        resultsBody.innerHTML = `<tr><td colspan="5" class="px-6 py-12 text-center text-zinc-500 font-medium">No whiskies found matching your query.</td></tr>`;
        return;
      }

      resultsBody.innerHTML = items.map((item, idx) => {
        const formattedYear = item.Year
          ? escapeHtml(String(item.Year).replace(/\r\n|\r/g, '\n'))
          : '-';

        const formattedWb = formatWbList(item.WBcode);

        return `
          <tr data-index="${idx}" class="whisky-row block md:table-row hover:bg-zinc-800/40 active:bg-zinc-800/60 transition-colors cursor-pointer border-b border-zinc-800/60 last:border-none p-4 md:p-0">
            <!-- Mobile View: Card Layout | Desktop View: Standard Cell -->
            <td class="block md:table-cell md:px-6 md:py-4">
              <div class="flex justify-between items-start md:block">
                <span class="text-xs font-semibold uppercase tracking-wider text-zinc-500 md:hidden">Name</span>
                <span class="font-semibold text-amber-200 text-base md:text-sm text-right md:text-left hover:text-amber-300 transition-colors">${escapeHtml(item.Name || '-')}</span>
              </div>
            </td>
            
            <td class="block md:table-cell md:px-6 md:py-4 text-zinc-300">
              <div class="flex justify-between items-center md:block">
                <span class="text-xs font-semibold uppercase tracking-wider text-zinc-500 md:hidden">ABV</span>
                <span class="font-medium">${formatAbv(item.ABV)}</span>
              </div>
            </td>
            
            <td class="block md:table-cell md:px-6 md:py-4 text-zinc-300">
              <div class="flex justify-between items-center md:block">
                <span class="text-xs font-semibold uppercase tracking-wider text-zinc-500 md:hidden">Year</span>
                <span class="whitespace-pre-line text-right md:text-left">${formattedYear}</span>
              </div>
            </td>
            
            <td class="block md:table-cell md:px-6 md:py-4">
              <div class="flex justify-between items-center md:block">
                <span class="text-xs font-semibold uppercase tracking-wider text-zinc-500 md:hidden">Score</span>
                <span class="font-bold text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded text-xs inline-block">${escapeHtml(String(item.Score || '-'))}</span>
              </div>
            </td>
            
            <td class="block md:table-cell md:px-6 md:py-4 text-zinc-400 font-mono text-xs">
              <div class="flex justify-between items-center md:block">
                <span class="text-xs font-semibold uppercase tracking-wider text-zinc-500 font-sans md:hidden">WB Code</span>
                <span class="whitespace-pre-line text-right md:text-left">${formattedWb}</span>
              </div>
            </td>
          </tr>
        `;
      }).join('');
    }

    // Event Delegation
    resultsBody.addEventListener('click', (e) => {
      const row = e.target.closest('.whisky-row');
      if (row) {
        const index = parseInt(row.getAttribute('data-index'), 10);
        if (!isNaN(index) && currentFilteredData[index]) {
          openDetailModal(currentFilteredData[index]);
        }
      }
    });

    searchInput.addEventListener('input', (e) => {
      const query = e.target.value.trim();

      if (e.target.value.length > 0) {
        clearBtn.classList.remove('hidden');
      } else {
        clearBtn.classList.add('hidden');
      }

      if (!query) {
        renderTable(rawData);
        statusText.innerText = `Showing all ${rawData.length} whiskies.`;
        return;
      }

      if (!fuse) return;

      const cleanQuery = query.replace(/%/g, '').replace(',', '.');
      const tokens = cleanQuery.split(/\s+/).filter(t => t.length > 0);

      if (tokens.length === 0) {
        renderTable(rawData);
        return;
      }

      const extendedQuery = {
        $and: tokens.map(token => ({
          $or: [
            { Name: `'${token}` },
            { YearStr: `'${token}` },
            { WBcodeStr: `'${token}` },
            { searchableABV: `'${token}` },
            { ScoreStr: `'${token}` }
          ]
        }))
      };

      const results = fuse.search(extendedQuery);
      const filteredData = results.map(res => res.item);

      const avgScore = getAverageScore(filteredData);
      const avgText = avgScore !== null
        ? ` with avg score of <span class="font-bold text-emerald-400 bg-emerald-500/10 px-1.5 py-0.5 rounded">${avgScore}</span>`
        : '';

      statusText.innerHTML = `Found <span class="text-zinc-100 font-semibold">${filteredData.length}</span> matching result(s)${avgText}.`;
      renderTable(filteredData);
    });

    clearBtn.addEventListener('click', () => {
      searchInput.value = '';
      clearBtn.classList.add('hidden');
      searchInput.focus();
      searchInput.dispatchEvent(new Event('input'));
    });

    syncBtn.addEventListener('click', () => {
      fetchFreshData();
    });

    configBtn.addEventListener('click', openModal);
    modalCloseBtn.addEventListener('click', closeModal);
    modalCancelBtn.addEventListener('click', closeModal);
    modalSaveBtn.addEventListener('click', saveCredentialsAndFetch);

    detailCloseBtn.addEventListener('click', closeDetailModal);

    configModal.addEventListener('click', (e) => {
      if (e.target === configModal) closeModal();
    });

    detailModal.addEventListener('click', (e) => {
      if (e.target === detailModal) closeDetailModal();
    });

    window.addEventListener('scroll', () => {
      if (window.scrollY > 300) {
        scrollToTopBtn.classList.remove('opacity-0', 'pointer-events-none');
        scrollToTopBtn.classList.add('opacity-100');
      } else {
        scrollToTopBtn.classList.remove('opacity-100');
        scrollToTopBtn.classList.add('opacity-0', 'pointer-events-none');
      }
    });

    scrollToTopBtn.addEventListener('click', () => {
      window.scrollTo({
        top: 0,
        behavior: 'smooth'
      });
    });

    function escapeHtml(str) {
      return str.replace(/[&<>'"]/g,
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    loadData();
  </script>

  <script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/whisky_db_search/sw.js')
        .then(reg => console.log('Service Worker registered!'))
        .catch(err => console.error('Service Worker registration failed:', err));
    });
  }
  </script>

</body>
</html>
