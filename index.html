<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Whisky DB Search</title>
  <link rel="icon" href="assets/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-192x192.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="manifest" href="manifest.json">
  
  <!-- Tailwind CSS -->
  <link rel="stylesheet" href="style.css">
  <!-- Full Fuse.js bundle -->
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js"></script>
  
  <!-- Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Inter', sans-serif; }

          /* Remove native browser clear button on input[type="search"] */
      input[type="search"]::-webkit-search-decoration,
      input[type="search"]::-webkit-search-cancel-button,
      input[type="search"]::-webkit-search-results-button,
      input[type="search"]::-webkit-search-results-decoration {
        -webkit-appearance: none;
        appearance: none;
      }

      input[type="search"]::-ms-clear,
      input[type="search"]::-ms-reveal {
        display: none;
        width: 0;
        height: 0;
      }

  </style>
</head>

<body class="bg-zinc-950 text-zinc-100 min-h-screen font-sans selection:bg-amber-500/30 selection:text-amber-200 antialiased pb-20">

  <!-- Subtle gradient background blur behind top content -->
  <div class="fixed top-0 left-1/2 -translate-x-1/2 w-full max-w-7xl h-96 bg-amber-600/5 blur-[120px] pointer-events-none -z-10"></div>

  <div class="max-w-6xl mx-auto px-4 sm:px-6 pt-6 sm:pt-10">
    
    <!-- Header -->
    <header class="mb-8 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-6 border-b border-zinc-800/80 pb-6">
      <div class="flex items-center gap-3.5">
        <div class="relative">
          <img src="assets/web-app-manifest-192x192.png" alt="Whisky DB" class="w-12 h-12 rounded-xl shadow-lg ring-1 ring-amber-500/20 object-cover">
        </div>
        <div>
          <h1 class="text-2xl sm:text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-amber-200 via-amber-400 to-amber-500 tracking-tight">
            Whisky DB
          </h1>
          <p class="text-xs sm:text-sm text-zinc-400 font-normal">Search by Name, Year, ABV, Score, or WB Code</p>
        </div>
      </div>

      <div class="flex items-center gap-2.5 self-start sm:self-auto">
        <button id="syncBtn" class="bg-amber-500/10 hover:bg-amber-500/20 text-amber-400 border border-amber-500/20 px-3.5 py-2 rounded-xl text-xs font-semibold flex items-center gap-2 transition-all active:scale-95 cursor-pointer shadow-sm">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
          Sync DB
        </button>
        <button id="configBtn" class="bg-zinc-900 hover:bg-zinc-800 text-zinc-300 border border-zinc-800 px-3.5 py-2 rounded-xl text-xs font-semibold flex items-center gap-2 transition-all active:scale-95 cursor-pointer shadow-sm">
          <svg class="w-4 h-4 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
          Config
        </button>
      </div>
    </header>

    <!-- Floating / Sticky Modern Search Input Bar -->
    <div class="sticky top-4 z-30 mb-6">
      <div class="relative flex items-center shadow-2xl rounded-2xl">
        <input
          type="search"
          id="searchInput"
          placeholder="e.g. Caol Lady 2025 55.4"
          enterkeyhint="search"
          autocorrect="off"
          autocapitalize="none"
          class="w-full bg-zinc-900/80 backdrop-blur-xl border border-zinc-700/60 text-white rounded-2xl pl-12 pr-11 py-3.5 text-base sm:text-lg focus:outline-none focus:border-amber-500/60 focus:ring-4 focus:ring-amber-500/10 transition-all placeholder:text-zinc-500"
        />
        <svg class="w-5 h-5 absolute left-4 text-zinc-400 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
        </svg>
        <button
          id="clearBtn"
          class="hidden absolute right-3.5 text-zinc-400 hover:text-white transition-colors p-1 cursor-pointer bg-zinc-800 rounded-lg"
          aria-label="Clear search"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>
      </div>
    </div>

    <!-- Status Bar -->
    <div class="flex items-center justify-between mb-4 px-1.5">
      <div id="statusText" class="text-xs sm:text-sm text-zinc-400 font-medium">Checking credentials...</div>
    </div>

    <!-- Results Container -->
    <div class="bg-zinc-900/50 rounded-2xl shadow-xl border border-zinc-800 overflow-hidden backdrop-blur-md">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-zinc-300">
          <thead class="hidden md:table-header-group bg-zinc-900/80 text-zinc-400 uppercase text-[11px] font-semibold tracking-wider border-b border-zinc-800">
            <tr>
              <th class="px-6 py-4">Name</th>
              <th class="px-6 py-4">ABV</th>
              <th class="px-6 py-4">Year</th>
              <th class="px-6 py-4">Score</th>
              <th class="px-6 py-4">WB Code</th>
            </tr>
          </thead>
          <tbody id="resultsBody" class="divide-y divide-zinc-800/60">
            <tr>
              <td colspan="5" class="px-6 py-12 text-center text-zinc-500 font-medium">Awaiting authentication...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Detail Modal -->
  <div id="detailModal" class="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 z-50 hidden transition-all">
    <div class="bg-zinc-900 border border-zinc-800 rounded-2xl max-w-lg w-full p-6 shadow-2xl space-y-5 relative transform transition-all scale-100">
      <button id="detailCloseBtn" class="absolute top-4 right-4 text-zinc-400 hover:text-white bg-zinc-800/50 hover:bg-zinc-800 p-2 rounded-xl transition cursor-pointer">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
      </button>

      <div id="detailContent"></div>
    </div>
  </div>

  <!-- Config Modal -->
  <div id="configModal" class="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 z-50 hidden transition-all">
    <div class="bg-zinc-900 border border-zinc-800 rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-5">
      <div class="flex justify-between items-center border-b border-zinc-800 pb-4">
        <div class="flex items-center gap-2">
          <span class="text-xl">🔑</span>
          <h2 class="text-lg font-bold text-white">Database Config</h2>
        </div>
        <button id="modalCloseBtn" class="text-zinc-400 hover:text-white bg-zinc-800/50 hover:bg-zinc-800 p-1.5 rounded-lg transition cursor-pointer">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>

      <div class="space-y-4">
        <div>
          <label for="modalDbUrl" class="block text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-1.5">Firebase Base URL</label>
          <input
            type="url"
            id="modalDbUrl"
            placeholder="https://YOUR-PROJECT-ID-default-rtdb.firebaseio.com"
            class="w-full bg-zinc-950 border border-zinc-800 text-white rounded-xl p-3 text-sm focus:outline-none focus:border-amber-500 transition placeholder:text-zinc-600"
          />
        </div>

        <div>
          <label for="modalAccessCode" class="block text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-1.5">Access Code / Tracker</label>
          <input
            type="password"
            id="modalAccessCode"
            placeholder="Enter access code"
            class="w-full bg-zinc-950 border border-zinc-800 text-white rounded-xl p-3 text-sm focus:outline-none focus:border-amber-500 transition placeholder:text-zinc-600"
          />
        </div>
      </div>

      <div class="flex justify-end gap-2.5 pt-3 border-t border-zinc-800">
        <button id="modalCancelBtn" class="px-4 py-2 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 text-xs font-semibold rounded-xl transition cursor-pointer">
          Cancel
        </button>
        <button id="modalSaveBtn" class="px-4 py-2 bg-amber-500 hover:bg-amber-400 text-zinc-950 text-xs font-bold rounded-xl transition cursor-pointer shadow-lg shadow-amber-500/10">
          Save & Sync
        </button>
      </div>
    </div>
  </div>

  <!-- Scroll to Top Button -->
  <button
    id="scrollToTopBtn"
    class="fixed bottom-6 right-6 bg-amber-500 hover:bg-amber-400 text-zinc-950 p-3.5 rounded-2xl shadow-2xl transition-all duration-300 opacity-0 pointer-events-none z-40 cursor-pointer active:scale-90"
    aria-label="Scroll to top"
  >
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 10l7-7m0 0l7 7m-7-7v18"></path>
    </svg>
  </button>

  <script src="app.js"></script>
</body>
</html>
